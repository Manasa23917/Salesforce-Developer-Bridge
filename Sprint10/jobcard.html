<template>
    <lightning-card title="Job Card">

        <div class="slds-p-around_medium">

            <p>
                <strong>Job Name:</strong> {job.Name}
            </p>

            <p>
                <strong>Company:</strong> {job.CompanyName__c}
            </p>

            <p>
                <strong>Closing Date:</strong> {job.ClosingDate__c}
            </p>

            <p>
                <strong>Status:</strong> {job.JobStatus__c}
            </p>

            <p>
                <strong>Minimum CGPA:</strong> {job.Minimum_CGPA__c}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="View Details"
                    data-id={job.Id}
                    onclick={handleViewDetails}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    variant="brand"
                    label="Apply"
                    data-id={job.Id}
                    onclick={handleApply}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>
</template>
